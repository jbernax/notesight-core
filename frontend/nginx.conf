server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Defense-in-depth HTTP security headers for static SPA delivery
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Serve static frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static production assets
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Cache static icons, favicons, and sample scores
    location ~* \.(?:svg|ico|png|jpe?g|webp|musicxml|xml)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }


    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable proxy buffering for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;

        # Allow large file uploads (PDFs, large sheet music images)
        client_max_body_size 50M;
    }
}

